<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2440">
<title>땅따먹기 대작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Jua',system-ui,sans-serif;background:#1b2440;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;cursor:pointer;border:0}
input{font-family:inherit}
.hide{display:none!important}

/* ---------- 첫 화면 ---------- */
#home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:radial-gradient(circle at 20% 20%,#ff4f8755,transparent 40%),radial-gradient(circle at 80% 30%,#2f7bff55,transparent 40%),radial-gradient(circle at 50% 90%,#1fae5b44,transparent 45%),#1b2440}
#home h1{font-size:clamp(40px,8vw,84px);text-shadow:0 6px 0 #0006;letter-spacing:2px}
#home h1 span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
#home .cards{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
#home .card{width:min(320px,80vw);padding:28px 20px;border-radius:28px;font-size:28px;color:#1b2440;background:#fff;box-shadow:0 10px 0 #0005;transition:transform .1s}
#home .card:active{transform:translateY(6px);box-shadow:0 4px 0 #0005}
#home .card b{display:block;font-size:64px;margin-bottom:8px}
#home .card small{display:block;font-size:17px;color:#667;margin-top:6px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ---------- 선생님(TV) 화면 ---------- */
#host{position:fixed;inset:0;display:flex;flex-direction:column}
#hud{height:96px;flex:none;display:flex;align-items:center;gap:18px;padding:10px 22px;background:#121a30;border-bottom:4px solid #0b1020}
#hud .title{font-size:26px;white-space:nowrap}
#hud .mid{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
#bar{height:30px;border-radius:15px;overflow:hidden;display:flex;background:#3a4566;box-shadow:inset 0 2px 6px #0008}
#bar div{height:100%;transition:width .4s}
#chips{display:flex;gap:8px;flex-wrap:nowrap;overflow:hidden}
.chip{display:flex;align-items:center;gap:4px;padding:2px 10px 2px 6px;border-radius:14px;font-size:19px;background:#fff1;white-space:nowrap}
.chip i{font-style:normal;font-size:12px;opacity:.8}
.chip.lead{background:#ffd54a;color:#1b2440}
#timer{font-size:52px;min-width:150px;text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 #0008}
#timer.warn{color:#ff5a5a;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
#stage{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%}
body.fever #stage{animation:feverglow .6s infinite alternate}
@keyframes feverglow{from{box-shadow:inset 0 0 30px #ff5a1f}to{box-shadow:inset 0 0 70px #ffcc00}}
#ctrl{position:absolute;right:14px;bottom:14px;display:flex;gap:8px;z-index:5}
#ctrl button{width:54px;height:54px;border-radius:16px;font-size:26px;background:#fffd;color:#1b2440;box-shadow:0 4px 0 #0006}
#banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.5);opacity:0;font-size:clamp(40px,6vw,90px);white-space:nowrap;
  text-shadow:0 6px 0 #0009,0 0 30px #000;pointer-events:none;z-index:6;transition:all .35s cubic-bezier(.2,1.6,.4,1)}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:min(40vh,320px);color:#fff;opacity:0;pointer-events:none;z-index:6;
  text-shadow:0 10px 0 #0007,0 0 40px #ff3b3b}
#big.go{animation:bigpop .9s ease-out}
@keyframes bigpop{0%{opacity:.95;transform:translate(-50%,-50%) scale(1.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}

/* 대기실 */
#lobby{position:absolute;inset:0;z-index:8;display:flex;gap:24px;padding:24px;background:#1b2440f2}
#lobby .left{width:min(380px,32vw);display:flex;flex-direction:column;align-items:center;gap:12px;background:#fff;color:#1b2440;border-radius:28px;padding:22px}
#lobby .left h2{font-size:30px}
#qr{width:100%;aspect-ratio:1;max-width:300px}
#qr svg{width:100%;height:100%}
#roomcode{font-size:62px;letter-spacing:8px;color:#ff4f87;line-height:1}
#roomurl{font-size:14px;color:#556;word-break:break-all;text-align:center;font-family:system-ui}
#lobby .right{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
#lobby .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#lobby .top h1{font-size:44px;flex:1;white-space:nowrap}
#pcount{font-size:24px;background:#fff2;padding:6px 16px;border-radius:20px}
#teamcols{flex:1;display:grid;gap:12px;min-height:0;overflow:auto}
.tcol{border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:0}
.tcol h3{font-size:24px;display:flex;align-items:center;gap:6px;color:#fff;text-shadow:0 2px 0 #0005}
.tcol h3 small{margin-left:auto;font-size:18px;opacity:.9}
.tcol .names{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.nm{background:#fff;color:#1b2440;padding:4px 10px;border-radius:12px;font-size:19px;cursor:pointer}
.nm.off{opacity:.45}
.nm.bot{background:#e8ecf5;color:#667}
#lobby .opts{display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:#fff1;padding:12px 16px;border-radius:18px;font-size:20px}
.seg{display:flex;gap:4px;background:#0003;padding:4px;border-radius:14px}
.seg button{padding:6px 14px;border-radius:10px;font-size:19px;background:transparent;color:#fff}
.seg button.on{background:#fff;color:#1b2440}
.btn{padding:10px 18px;border-radius:14px;font-size:20px;background:#fff;color:#1b2440;box-shadow:0 4px 0 #0005}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0005}
.btn.big{font-size:34px;padding:14px 36px;background:#ffd54a;border-radius:20px;box-shadow:0 6px 0 #b8901a}
.btn.ghost{background:#fff2;color:#fff;box-shadow:none}
#lobby .acts{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#lobby .acts .sp{flex:1}

/* 결과 */
#result{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0b1020e6;padding:20px}
#result h1{font-size:56px;text-shadow:0 5px 0 #0008}
#podium{display:flex;align-items:flex-end;gap:22px;height:42vh}
.pod{width:min(130px,13vw);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pod .em{font-size:56px;transition:transform .5s}
.pod .pc{font-size:30px;margin:4px 0;font-variant-numeric:tabular-nums}
.pod .col{width:100%;border-radius:16px 16px 6px 6px;height:0%;transition:height 2.6s cubic-bezier(.3,.1,.2,1);box-shadow:inset 0 -10px 0 #0003}
.pod .nmT{font-size:22px;margin-top:6px}
.pod.win .em{transform:scale(1.5) translateY(-10px)}
.pod .crown{font-size:48px;opacity:0;transform:translateY(20px);transition:all .5s}
.pod.win .crown{opacity:1;transform:none}
#mvp{display:flex;gap:16px;opacity:0;transition:opacity .6s}
#mvp.on{opacity:1}
#mvp .m{background:#fff;color:#1b2440;border-radius:18px;padding:10px 18px;font-size:22px;text-align:center}
#mvp .m b{display:block;font-size:30px}
#result .acts{display:flex;gap:14px;opacity:0;transition:opacity .6s}
#result .acts.on{opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}

/* ---------- 학생 컨트롤러 ---------- */
#pad{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--tc,#1b2440);transition:background .4s}
#join{position:fixed;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 18px;background:#1b2440;touch-action:pan-y}
#join h1{font-size:40px;margin-top:10px}
#join label{font-size:20px;align-self:center;width:min(440px,92vw)}
#join input{width:min(440px,92vw);font-size:30px;padding:12px 16px;border-radius:16px;border:0;text-align:center;color:#1b2440;user-select:text;-webkit-user-select:text}
#jteams{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(440px,92vw)}
#jteams button{padding:12px 4px;border-radius:16px;font-size:22px;color:#fff;border:4px solid transparent;opacity:.7}
#jteams button b{display:block;font-size:40px}
#jteams button.on{border-color:#fff;opacity:1;transform:scale(1.05);box-shadow:0 0 0 4px #ffd54a}
#jmsg{min-height:28px;font-size:20px;color:#ffd54a;text-align:center}
#jbtn{width:min(440px,92vw);font-size:32px;padding:14px;border-radius:20px;background:#ffd54a;color:#1b2440;box-shadow:0 6px 0 #b8901a}
#jbtn:disabled{opacity:.4}

#ptop{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#0003}
#pme{font-size:54px;width:72px;height:72px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #0004}
#pname{flex:1;min-width:0}
#pname b{display:block;font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pname span{font-size:19px;opacity:.9}
#ptime{font-size:44px;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 #0005}
#pinfo{flex:none;padding:0 16px 8px;display:flex;flex-direction:column;gap:6px}
#pbar{height:22px;border-radius:11px;overflow:hidden;display:flex;background:#0004;border:3px solid #fff}
#pbar div{height:100%;transition:width .4s}
#pstat{display:flex;justify-content:space-between;font-size:22px}
#parea{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
#dpad{position:relative;width:min(88vw,62vh,560px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#ffffff40 0 18%,#ffffff22 19% 100%);box-shadow:inset 0 0 0 6px #fff5,0 12px 0 #0003;touch-action:none}
#dpad .a{position:absolute;width:34%;height:34%;display:flex;align-items:center;justify-content:center;border-radius:28%;
  background:#fff;color:var(--tc,#1b2440);font-size:min(16vw,11vh,100px);box-shadow:0 8px 0 #0004;transition:transform .06s,background .06s;pointer-events:none}
#dpad .u{left:33%;top:2%}#dpad .d{left:33%;bottom:2%}#dpad .l{left:2%;top:33%}#dpad .r{right:2%;top:33%}
#dpad .a.on{transform:translateY(6px) scale(.95);background:#ffd54a;color:#1b2440;box-shadow:0 2px 0 #0004}
#dpad .hub{position:absolute;left:39%;top:39%;width:22%;height:22%;border-radius:50%;background:#fff3;pointer-events:none}
#pover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  background:#0009;font-size:32px;padding:20px;z-index:3;border-radius:0}
#pover .n{font-size:min(40vw,240px);line-height:1}
#pover .em{font-size:90px}
#pover .sm{font-size:22px;opacity:.9}
#pbot{flex:none;display:flex;gap:12px;padding:10px 16px 16px;justify-content:center}
#pbot button{font-size:24px;padding:12px 22px;border-radius:18px;background:#fff;color:#1b2440;box-shadow:0 5px 0 #0004}
#pbot button:active{transform:translateY(3px);box-shadow:0 2px 0 #0004}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:30;background:#fff;color:#1b2440;font-size:34px;
  padding:14px 26px;border-radius:24px;box-shadow:0 8px 0 #0005;transition:all .25s cubic-bezier(.2,1.6,.4,1);white-space:nowrap;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#warnbar{position:fixed;left:0;right:0;top:0;z-index:40;background:#ff5a5a;color:#fff;text-align:center;font-size:20px;padding:6px}
</style>
</head>
<body>

<div id="home" class="hide">
  <h1><span>🎨</span> 땅따먹기 대작전 <span style="animation-delay:.3s">🏁</span></h1>
  <div class="cards">
    <button class="card" onclick="location.search='?host'"><b>📺</b>선생님 화면<small>교실 TV·컴퓨터에서 열어요</small></button>
    <button class="card" onclick="location.search='?pad'"><b>🎮</b>학생 방향키<small>태블릿에서 열어요</small></button>
  </div>
</div>

<!-- 선생님 화면 -->
<div id="host" class="hide">
  <div id="hud">
    <div class="title">🎨 땅따먹기</div>
    <div class="mid"><div id="bar"></div><div id="chips"></div></div>
    <div id="timer">2:00</div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="banner"></div>
    <div id="big"></div>
    <div id="ctrl">
      <button id="bPause" title="일시정지 (스페이스바)">⏸</button>
      <button id="bStop" title="지금 끝내기">⏹</button>
      <button id="bSound" title="소리">🔊</button>
      <button id="bFull" title="전체 화면">⛶</button>
    </div>

    <div id="lobby">
      <div class="left">
        <h2>📱 태블릿으로 찍어요</h2>
        <div id="qr"></div>
        <div style="font-size:20px">방 번호</div>
        <div id="roomcode">----</div>
        <div id="roomurl"></div>
      </div>
      <div class="right">
        <div class="top"><h1>🎨 땅따먹기 대작전</h1><div id="pcount">참가 0명</div></div>
        <div id="teamcols"></div>
        <div class="opts">
          <span>모둠 수</span><div class="seg" id="segTeams"></div>
          <span>시간</span><div class="seg" id="segDur"></div>
        </div>
        <div class="acts">
          <button class="btn ghost" id="bShuffle">🎲 모둠 고르게 섞기</button>
          <button class="btn ghost" id="bBot">🤖 연습 봇 +5</button>
          <button class="btn ghost hide" id="bBotX">봇 지우기</button>
          <span class="sp"></span>
          <button class="btn big" id="bStart">▶ 게임 시작</button>
        </div>
      </div>
    </div>

    <div id="result" class="hide">
      <h1 id="rtitle">결과 발표!</h1>
      <div id="podium"></div>
      <div id="mvp"></div>
      <div class="acts" id="racts">
        <button class="btn big" id="bAgain">🔁 같은 모둠으로 한 판 더</button>
        <button class="btn" id="bLobby" style="font-size:26px;padding:14px 22px">👥 대기실로</button>
      </div>
    </div>
  </div>
</div>

<!-- 학생 화면 -->
<div id="join" class="hide">
  <h1>🎮 땅따먹기 입장</h1>
  <label>방 번호</label>
  <input id="jcode" inputmode="numeric" maxlength="4" placeholder="4자리 숫자" autocomplete="off">
  <label>내 이름</label>
  <input id="jname" maxlength="6" placeholder="이름" autocomplete="off">
  <label id="jtl" class="hide">내 모둠</label>
  <div id="jteams"></div>
  <div id="jmsg"></div>
  <button id="jbtn" disabled>입장하기</button>
</div>
<div id="pad" class="hide">
  <div id="ptop">
    <div id="pme">🐰</div>
    <div id="pname"><b>이름</b><span>토끼팀</span></div>
    <div id="ptime">-:--</div>
  </div>
  <div id="pinfo">
    <div id="pbar"></div>
    <div id="pstat"><span id="prank">우리 팀 -등</span><span id="pcells">내가 칠한 칸 0</span></div>
  </div>
  <div id="parea">
    <div id="dpad"><div class="hub"></div><div class="a u">▲</div><div class="a d">▼</div><div class="a l">◀</div><div class="a r">▶</div></div>
    <div id="pover"></div>
  </div>
  <div id="pbot">
    <button id="bWhere">📍 나 어디 있지?</button>
    <button id="bChange" class="hide">✏️ 모둠·이름 바꾸기</button>
  </div>
</div>
<div id="toast"></div>
<canvas id="fx"></canvas>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  function makeBoard() {
    grid.fill(-1); paintT.fill(0); items = []; booms = []; counts = [0, 0, 0, 0, 0, 0];
    bases = [];
    for (let i = 0; i < nTeams; i++) {
      const a = Math.PI + i * 2 * Math.PI / nTeams;

    }
    const W = [];

    for (let x = cx - 4; x <= cx + 5; x++) for (let y = cy; y <= cy + 1; y++) W.push([x, y]);
    for (let y = cy - 3; y <= cy + 4; y++) for (let x = cx; x <= cx + 1; x++) W.push([x, y]);
    [[.22, .25], [.75, .25], [.22, .72], [.75, .72]].forEach(([fx, fy]) => { const x = Math.round(COLS * fx), y = Math.round(ROWS * fy); W.push([x, y], [x + 1, y], [x, y + 1], [x + 1, y + 1]); });
    [[.5, .08], [.5, .88]].forEach(([fx, fy]) => { const x = Math.round(COLS * fx) - 1, y = Math.round(ROWS * fy); W.push([x - 1, y], [x, y], [x + 1, y], [x + 2, y]); });

    for (const [x, y] of W) {

      if (bases.some(([bx, by]) => Math.abs(bx - x) <= 3 && Math.abs(by - y) <= 3)) continue;
      if (grid[y * COLS + x] !== -2) { grid[y * COLS + x] = -2; walls++; }
    }
    bases.forEach(([bx, by], t) => { for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) paint(bx + dx, by + dy, t, null); });
  }
  const total = () => COLS * ROWS - walls;
  const free = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && grid[y * COLS + x] !== -2;
  function paint(x, y, t, p) {
    if (!free(x, y)) return; const i = y * COLS + x, o = grid[i];
    if (o === t) return; if (o >= 0) counts[o]--; counts[t]++; grid[i] = t; paintT[i] = now(); if (p) p.cells++;
  }
  const SPIRAL = (() => { const a = []; for (let r = 0; r <= 4; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (Math.max(Math.abs(dx), Math.abs(dy)) === r) a.push([dx, dy]); return a; })();
  function spawn(p) {
    const [bx, by] = bases[p.team] || [2, 2];
    let k = 0; for (const q of P.values()) if (q !== p && q.team === p.team && q.placed) k++;
    let x = bx, y = by;
    for (let j = 0; j < SPIRAL.length; j++) { const [dx, dy] = SPIRAL[(k + j) % SPIRAL.length]; if (free(bx + dx, by + dy)) { x = bx + dx; y = by + dy; break; } }
    Object.assign(p, { x, y, fx: x, fy: y, t0: 0, dur: STEP_MS, moving: false, placed: true, boostUntil: 0, starUntil: 0 });

  }
  function placeAll() { for (const p of P.values()) p.placed = false; for (const p of P.values()) { p.cells = 0; spawn(p); } }
  function teamSizes() { const s = Array(nTeams).fill(0); for (const p of P.values()) if (p.team < nTeams) s[p.team]++; return s; }
  function smallest() { const s = teamSizes(); return s.indexOf(Math.min(...s)); }

  /* ----- 방 만들기 ----- */
  async function openRoom() {
    let c = sessionStorage.getItem('ttang_code'), st = null;
    if (c) st = (await db.ref(R(c) + '/state').once('value')).val();
    if (!c || !st) {
      cleanup();
      for (let i = 0; i < 20; i++) { c = String(1000 + Math.floor(Math.random() * 9000)); if (!(await db.ref(R(c) + '/state').once('value')).exists()) break; }
      await db.ref(R(c)).set({ state: { phase: 'lobby', teams: nTeams, dur, left: dur, cd: 0, scores: [0], fever: false, host: true, created: TS() } });
    } else { nTeams = st.teams || 5; dur = st.dur || 120; }
    code = c; sessionStorage.setItem('ttang_code', c); ref = db.ref(R(c));
    left = dur; makeBoard();
    const url = location.origin + location.pathname + '?room=' + c;
    $('#roomcode').textContent = c; $('#roomurl').textContent = url;
    try { const q = qrcode(0, 'M'); q.addData(url); q.make(); $('#qr').innerHTML = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true }); } catch (e) {}
    setPhase('lobby');
    db.ref('.info/connected').on('value', s => { if (s.val()) { ref.child('state/host').set(true); ref.child('state/host').onDisconnect().set(false); } });
    attachT = now();
    ref.child('players').on('child_added', s => onPlayer(s.key, s.val()));
    ref.child('players').on('child_changed', s => onPlayer(s.key, s.val()));
    ref.child('players').on('child_removed', s => { P.delete(s.key); delete inputs[s.key]; renderLobby(); });
    ref.child('in').on('child_added', s => inputs[s.key] = s.val() || '');
    ref.child('in').on('child_changed', s => inputs[s.key] = s.val() || '');
    const onPing = s => { if (now() - attachT < 2000) return; const p = P.get(s.key); if (p) p.pingUntil = now() + 3000; };
    ref.child('ping').on('child_added', onPing); ref.child('ping').on('child_changed', onPing);
  }
  async function cleanup() {   // 하루 지난 방 지우기
    try { const all = (await db.ref(DB_ROOT + '/rooms').once('value')).val() || {}; const lim = Date.now() - 12 * 3600e3;
      for (const k in all) { const c = all[k] && all[k].state && all[k].state.created; if (!c || c < lim) db.ref(R(k)).remove(); } } catch (e) {}
  }
  function onPlayer(pid, v) {
    if (!v || !v.name) { ref.child('players/' + pid).remove(); return; }   // 이름 없는 유령 기록 정리
    let p = P.get(pid), t = v.team;
    if (!(t >= 0 && t < nTeams)) { t = smallest(); ref.child('players/' + pid + '/team').set(t); }
    if (!p) { p = { pid, name: v.name, team: t, on: v.on !== false, cells: 0, pingUntil: 0 }; P.set(pid, p); spawn(p); }
    else { p.name = v.name; p.on = v.on !== false; if (p.team !== t) { p.team = t; p.placed = false; spawn(p); } }
    renderLobby();
  }

  /* ----- 진행 단계 ----- */
  function setPhase(ph) {
    phase = ph;
    $('#lobby').classList.toggle('hide', ph !== 'lobby');
    $('#result').classList.toggle('hide', ph !== 'end');
    $('#ctrl').classList.toggle('hide', ph === 'lobby' || ph === 'end');
    $('#bPause').textContent = ph === 'pause' ? '▶' : '⏸';

    if (ph === 'play') SND.startBgm(); else SND.stopBgm();
    sync(true);
  }
  function sync(force) {
    if (!ref) return; const t = now(); if (!force && t - lastSync < 1000) return; lastSync = t;
    const scores = pcts();
    ref.child('state').update({ phase, teams: nTeams, dur, left: Math.ceil(left), cd, scores, fever });
    const c = {}; for (const p of P.values()) if (!p.bot) c[p.pid] = p.cells; if (Object.keys(c).length) ref.child('cnt').update(c);
  }
  const pcts = () => counts.slice(0, nTeams).map(v => Math.round(v / total() * 1000) / 10);

  function startGame() {
    SND.init(); keepAwake();
    fever = false; SND.tempo = 128; left = dur; makeBoard(); placeAll(); nextItem = ITEM_EVERY * 1000; lastSec = -1;
    for (const p of P.values()) paint(p.x, p.y, p.team, p);
    $('#result').classList.add('hide');
    cd = 3; setPhase('count'); countdown();
  }
  function countdown() {
    showBig(cd > 0 ? cd : '시작!'); cd > 0 ? SND.beep() : SND.go(); sync(true);
    if (cd > 0) { setTimeout(() => { cd--; countdown(); }, 1000); return; }
    setPhase('play'); banner('🎨 칠해라!', 900);
  }
  function showBig(t) { const b = $('#big'); b.textContent = t; b.style.fontSize = typeof t === 'string' ? 'min(22vh,180px)' : ''; b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); }
  function banner(t, ms = 2000) { const b = $('#banner'); b.textContent = t; b.classList.add('on'); clearTimeout(banner.h); banner.h = setTimeout(() => b.classList.remove('on'), ms); }

  /* ----- 한 프레임 ----- */
  let last = now();
  function loop() {
    const t = now(), dt = Math.min(100, t - last); last = t;
    if (phase === 'play') update(t, dt);
    draw(t); hud();
    requestAnimationFrame(loop);
  }
  function update(t, dt) {
    left -= dt / 1000;
    const sec = Math.ceil(left);
    if (sec !== lastSec) { lastSec = sec; if (sec <= 10 && sec > 0) { SND.tick(); showBig(sec); } }
    if (!fever && left <= FEVER_SEC) { fever = true; document.body.classList.add('fever'); SND.tempo = 156; banner('🔥 피버 타임! 아이템이 쏟아져요!', 2400); SND.go(); }
    if (left <= 0) { left = 0; finish(); return; }
    // 아이템 떨어뜨리기
    nextItem -= dt;
    if (nextItem <= 0) { nextItem = (fever ? ITEM_EVERY / 2.5 : ITEM_EVERY) * 1000; dropItem(); if (fever) dropItem(); }
    // 움직이기
    for (const p of P.values()) {
      if (p.bot) botThink(p, t);
      const want = p.on || p.bot ? (p.bot ? p.botDir : inputs[p.pid]) : '';
      if (p.moving && t - p.t0 >= p.dur) {          // 도착
        p.moving = false; p.fx = p.x; p.fy = p.y; arrive(p, t);

  function startMove(p, d, t0, t) {

    p.dur = t < p.boostUntil ? BOOST_MS : STEP_MS; p.t0 = Math.max(t0, t - p.dur * .5);
  }
  function arrive(p, t) {

    else paint(p.x, p.y, p.team, p);

  }
  function useItem(p, k, t) {

    if (k === 'star') { p.starUntil = t + STAR_SEC * 1000; SND.pick(); }
    if (k === 'bomb') { for (let dx = -BOMB_R; dx <= BOMB_R; dx++) for (let dy = -BOMB_R; dy <= BOMB_R; dy++) if (Math.abs(dx) + Math.abs(dy) <= BOMB_R) paint(p.x + dx, p.y + dy, p.team, p); booms.push({ x: p.x, y: p.y, c: TEAMS[p.team].c, t }); SND.bomb(); }
    if (!p.bot) ref.child('ev/' + p.pid).set({ k, t: Date.now() });
  }
  function dropItem() {
    if (items.length >= (fever ? 10 : 5)) return;
    for (let i = 0; i < 40; i++) {
      const x = Math.floor(Math.random() * COLS), y = Math.floor(Math.random() * ROWS);
      if (!free(x, y) || items.some(it => it.x === x && it.y === y)) continue;
      const r = Math.random(), k = r < .4 ? 'speed' : r < .7 ? 'bomb' : 'star';
      items.push({ x, y, k, t: now() }); return;
    }
  }
  function botThink(p, t) {
    if (!p.botNext || t > p.botNext || (!p.moving && p.botDir && !free(p.x + DIRS[p.botDir][0], p.y + DIRS[p.botDir][1]))) {
      const opts = 'udlr'.split('').filter(d => free(p.x + DIRS[d][0], p.y + DIRS[d][1]));
      p.botDir = opts[Math.floor(Math.random() * opts.length)] || ''; p.botNext = t + 300 + Math.random() * 1200;
    }
  }

  /* ----- 끝 ----- */
  function finish() {
    fever = false; document.body.classList.remove('fever'); SND.tempo = 128;
    const sc = pcts(), order = sc.map((v, i) => i).sort((a, b) => sc[b] - sc[a]);
    const mvp = [...P.values()].sort((a, b) => b.cells - a.cells).slice(0, 3).map(p => ({ n: p.name, t: p.team, c: p.cells, id: p.bot ? '' : p.pid }));
    setPhase('end');
    ref.child('state').update({ rank: order, mvp });
    showResult(sc, order, mvp);
  }
  function showResult(sc, order, mvp) {
    const pod = $('#podium'); pod.innerHTML = ''; $('#rtitle').textContent = '두구두구… 결과 발표!';
    $('#mvp').classList.remove('on'); $('#racts').classList.remove('on');
    const max = Math.max(1, ...sc);
    for (let i = 0; i < nTeams; i++) {
      const d = document.createElement('div'); d.className = 'pod';
      d.innerHTML = `<div class="crown">👑</div><div class="em">${TEAMS[i].e}</div><div class="pc">0%</div><div class="col" style="background:${TEAMS[i].c}"></div><div class="nmT">${TEAMS[i].n}</div>`;
      pod.appendChild(d);
    }
    SND.drum();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      [...pod.children].forEach((d, i) => d.querySelector('.col').style.height = (sc[i] / max * 72) + '%');
      const t0 = now(); const tk = () => { const k = Math.min(1, (now() - t0) / 2600), e = 1 - Math.pow(1 - k, 3);
        [...pod.children].forEach((d, i) => d.querySelector('.pc').textContent = (sc[i] * e).toFixed(1) + '%'); if (k < 1) requestAnimationFrame(tk); }; tk();
    }));
    setTimeout(() => {
      const w = order[0], tie = order.filter(i => sc[i] === sc[w]);
      tie.forEach(i => pod.children[i].classList.add('win'));
      $('#rtitle').textContent = tie.length > 1 ? '🤝 공동 1등!' : `🎉 ${TEAMS[w].e} ${TEAMS[w].n}팀 승리!`;
      SND.fanfare(); confetti(tie.map(i => TEAMS[i].c));
      $('#mvp').innerHTML = mvp.map((m, i) => `<div class="m">${['🥇', '🥈', '🥉'][i]} 많이 칠한 사람<b>${TEAMS[m.t].e} ${m.n}</b>${m.c}칸</div>`).join('');
      setTimeout(() => { $('#mvp').classList.add('on'); $('#racts').classList.add('on'); }, 900);
    }, 3000);
  }

  /* ----- 그리기 ----- */
  let cell = 20, ox = 0, oy = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1; const r = cv.getBoundingClientRect();
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    cell = Math.floor(Math.min((r.width - 16) / COLS, (r.height - 14) / (ROWS + .6))); ox = Math.floor((r.width - cell * COLS) / 2); oy = Math.floor((r.height - cell * (ROWS + .6)) / 2) + 6;
  }
  addEventListener('resize', resize);
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); const W = cv.width / dpr, H = cv.height / dpr;
    ctx.fillStyle = '#1b2440'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f4f6fb'; rr(ox - 6, oy - 6, cell * COLS + 12, cell * ROWS + 12, 14); ctx.fill();
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const i = y * COLS + x, g = grid[i], px = ox + x * cell, py = oy + y * cell;
      if (g === -1) { if ((x + y) & 1) { ctx.fillStyle = '#e7ebf3'; ctx.fillRect(px, py, cell, cell); } continue; }
      if (g === -2) { ctx.fillStyle = '#3b4668'; rr(px + 1, py + 1, cell - 2, cell - 2, cell * .2); ctx.fill(); ctx.fillStyle = '#56628a'; rr(px + 3, py + 3, cell - 6, cell * .35, cell * .12); ctx.fill(); continue; }
      const k = Math.min(1, (t - paintT[i]) / 220), s = .55 + .45 * k;
      ctx.fillStyle = k < 1 ? TEAMS[g].c : TEAMS[g].l; const w = cell * s;
      rr(px + (cell - w) / 2, py + (cell - w) / 2, w, w, cell * .18); ctx.fill();
    }
    // 아이템
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const it of items) {
      const bob = Math.sin((t - it.t) / 220) * cell * .08, cx = ox + (it.x + .5) * cell, cy = oy + (it.y + .5) * cell + bob;
      const a = Math.min(1, (t - it.t) / 300);
      ctx.globalAlpha = a; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, cell * .46, 0, 7); ctx.fill();
      ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 3; ctx.stroke();
      ctx.font = `${cell * .62}px sans-serif`; ctx.fillText(ITEMS[it.k].e, cx, cy + 1); ctx.globalAlpha = 1;
    }
    // 폭발
    for (const b of booms) { const k = (t - b.t) / 700; ctx.strokeStyle = b.c; ctx.globalAlpha = 1 - k; ctx.lineWidth = cell * .4 * (1 - k);
      ctx.beginPath(); ctx.arc(ox + (b.x + .5) * cell, oy + (b.y + .5) * cell, cell * (BOMB_R + .5) * k + cell * .5, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
    // 플레이어
    const list = [...P.values()].filter(p => p.placed).sort((a, b) => a.y - b.y);
    const pos = p => { const k = p.moving ? Math.min(1, (t - p.t0) / p.dur) : 1; return [ox + (p.fx + (p.x - p.fx) * k + .5) * cell, oy + (p.fy + (p.y - p.fy) * k + .5) * cell]; };
    for (const p of list) {
      const [cx, cy] = pos(p), T = TEAMS[p.team], r = cell * .46;
      ctx.globalAlpha = p.on || p.bot ? 1 : .35;
      if (t < p.starUntil) { ctx.fillStyle = T.c + '55'; rr(cx - cell * 1.5, cy - cell * 1.5, cell * 3, cell * 3, cell * .5); ctx.fill(); }
      if (t < p.boostUntil) { ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, r + 4 + Math.sin(t / 60) * 2, 0, 7); ctx.stroke(); }
      ctx.fillStyle = '#0003'; ctx.beginPath(); ctx.ellipse(cx, cy + r * .9, r * .8, r * .3, 0, 0, 7); ctx.fill();
      ctx.fillStyle = T.c; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      ctx.font = `${cell * .58}px sans-serif`; ctx.fillText(p.on || p.bot ? T.e : '💤', cx, cy + 1);

    }

    for (const p of list) {

      ctx.globalAlpha = p.on || p.bot ? .92 : .4; ctx.fillStyle = '#1b2440'; rr(cx - w / 2, y, w, h, h / 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(p.name, cx, y + h / 2 + 1); ctx.globalAlpha = 1;
    }
    // 나 어디? 표시
    for (const p of list) if (t < p.pingUntil) {
      const [cx, cy] = pos(p), k = ((t % 700) / 700);
      ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, cell * (3 - k * 2.2), 0, 7); ctx.stroke();
      ctx.font = `${cell * .7}px Jua, sans-serif`; const txt = `👇 ${p.name}`, w = ctx.measureText(txt).width + 24, h = cell * 1.1, y = cy - cell * 2.2;
      ctx.fillStyle = '#ffd54a'; rr(cx - w / 2, y - h / 2, w, h, h / 2); ctx.fill(); ctx.fillStyle = '#1b2440'; ctx.fillText(txt, cx, y + 2);
    }
  }
  let hudT = 0;
  function hud() {
    const t = now(); if (t - hudT < 200) return; hudT = t;
    const sc = pcts(); stackBar($('#bar'), sc, nTeams);
    const order = sc.map((v, i) => i).sort((a, b) => sc[b] - sc[a]);
    $('#chips').innerHTML = order.map((i, k) => `<div class="chip ${k === 0 && sc[i] > 0 ? 'lead' : ''}">${TEAMS[i].e} ${sc[i].toFixed(0)}%<i>${TEAMS[i].n}</i></div>`).join('');
    const tm = $('#timer'); tm.textContent = fmt(left); tm.classList.toggle('warn', phase === 'play' && left <= 10);
  }

  /* ----- 대기실 ----- */
  function renderLobby() {
    if (phase !== 'lobby') return;
    const cols = $('#teamcols'); cols.style.gridTemplateColumns = `repeat(${Math.min(nTeams, 3)},1fr)`;
    let html = '';
    for (let i = 0; i < nTeams; i++) {
      const mem = [...P.values()].filter(p => p.team === i);
      html += `<div class="tcol" style="background:${TEAMS[i].c}"><h3>${TEAMS[i].e} ${TEAMS[i].n}팀<small>${mem.length}명</small></h3><div class="names">` +
        mem.map(p => `<span class="nm ${p.on ? '' : 'off'} ${p.bot ? 'bot' : ''}" data-id="${p.pid}">${p.bot ? '🤖' : ''}${esc(p.name)}</span>`).join('') + '</div></div>';
    }
    cols.innerHTML = html;
    const real = [...P.values()].filter(p => !p.bot).length;
    $('#pcount').textContent = `참가 ${real}명` + (botN ? ` + 봇 ${[...P.values()].filter(p => p.bot).length}` : '');
    $('#segTeams').innerHTML = [2, 3, 4, 5, 6].map(n => `<button class="${n === nTeams ? 'on' : ''}" data-n="${n}">${n}</button>`).join('');
    $('#segDur').innerHTML = [60, 90, 120, 180].map(s => `<button class="${s === dur ? 'on' : ''}" data-s="${s}">${s % 60 ? (s / 60).toFixed(1) : s / 60}분</button>`).join('');
    $('#bBotX').classList.toggle('hide', !botN);
  }
  const esc = s => String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
  $('#teamcols').onclick = e => {
    const el = e.target.closest('.nm'); if (!el) return; const p = P.get(el.dataset.id); if (!p) return;
    if (p.bot) { P.delete(p.pid); renderLobby(); return; }
    if (confirm(`${p.name} 학생을 내보낼까요?`)) ref.child('players/' + p.pid).remove();
  };
  $('#segTeams').onclick = e => {
    const n = +e.target.dataset.n; if (!n) return; nTeams = n; makeBoard();
    for (const p of P.values()) if (p.team >= n) { p.team = -1; }
    for (const p of P.values()) if (p.team < 0) { p.team = smallest(); if (!p.bot) ref.child('players/' + p.pid + '/team').set(p.team); }
    placeAll(); renderLobby(); sync(true);
  };
  $('#segDur').onclick = e => { const s = +e.target.dataset.s; if (!s) return; dur = s; left = s; renderLobby(); sync(true); };
  $('#bShuffle').onclick = () => {
    const arr = [...P.values()].sort(() => Math.random() - .5);
    arr.forEach((p, i) => { p.team = i % nTeams; if (!p.bot) ref.child('players/' + p.pid + '/team').set(p.team); });
    placeAll(); renderLobby();
  };
  $('#bBot').onclick = () => {
    for (let i = 0; i < 5; i++) { botN++; const p = { pid: 'bot' + botN, name: '봇' + botN, team: smallest(), on: true, bot: true, cells: 0, pingUntil: 0 }; P.set(p.pid, p); spawn(p); }
    renderLobby();
  };
  $('#bBotX').onclick = () => { for (const p of [...P.values()]) if (p.bot) P.delete(p.pid); botN = 0; renderLobby(); };
  $('#bStart').onclick = () => { if (!P.size) { toast('아직 아무도 안 들어왔어요'); return; } startGame(); };
  $('#bAgain').onclick = startGame;
  $('#bLobby').onclick = () => { left = dur; makeBoard(); placeAll(); setPhase('lobby'); renderLobby(); };
  $('#bPause').onclick = () => { if (phase === 'play') setPhase('pause'), banner('⏸ 잠깐 멈춤', 99999); else if (phase === 'pause') { $('#banner').classList.remove('on'); setPhase('play'); } };
  $('#bStop').onclick = () => { if ((phase === 'play' || phase === 'pause') && confirm('지금 게임을 끝내고 결과를 볼까요?')) { $('#banner').classList.remove('on'); finish(); } };
  $('#bSound').onclick = () => { SND.on = !SND.on; $('#bSound').textContent = SND.on ? '🔊' : '🔇'; };
  $('#bFull').onclick = goFull;
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); $('#bPause').click(); } });
  addEventListener('pointerdown', () => SND.init(), { once: true });

  resize(); makeBoard(); renderLobby(); loop(); openRoom();
}

/* ---------- 색종이 ---------- */
function confetti(colors) {
  const c = $('#fx'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const ps = []; for (let i = 0; i < 220; i++) ps.push({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .6, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6.3, s: 6 + Math.random() * 8, c: Math.random() < .7 ? colors[i % colors.length] : ['#ffd54a', '#fff'][i % 2] });
  const t0 = now(); (function f() { x.clearRect(0, 0, c.width, c.height); const k = now() - t0;
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.r += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }
    if (k < 6000) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height); })();
}

/* ==========================================================
   학생 방향키 화면
   ========================================================== */
function Pad() {
  if (!initDB()) return;
  let pid = localStorage.getItem('ttang_pid');
  if (!pid) { pid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); localStorage.setItem('ttang_pid', pid); }
  let code = qs.get('room') || localStorage.getItem('ttang_room') || '', team = +(localStorage.getItem('ttang_team') ?? -1), joined = false, ref = null;
  let st = { phase: 'lobby', teams: 5, scores: [] }, stOff = null, dir = '', myCells = 0, lastEv = 0;
  const jcode = $('#jcode'), jname = $('#jname');
  jcode.value = code; jname.value = localStorage.getItem('ttang_name') || '';

  /* ----- 입장 화면 ----- */
  function showJoin(msg) {
    joined = false; $('#pad').classList.add('hide'); $('#join').classList.remove('hide'); $('#jmsg').textContent = msg || ''; checkCode();
  }
  async function checkCode() {
    const c = jcode.value.replace(/\D/g, ''); jcode.value = c;
    if (stOff) { stOff(); stOff = null; }
    $('#jteams').innerHTML = ''; $('#jtl').classList.add('hide'); $('#jbtn').disabled = true;
    if (c.length !== 4) return;
    const r = db.ref(R(c) + '/state'); const s = (await r.once('value')).val();
    if (!s) { $('#jmsg').textContent = '그런 방이 없어요. 번호를 다시 확인해요!'; return; }
    $('#jmsg').textContent = ''; code = c;
    const h = r.on('value', x => { const v = x.val(); if (v) { st = v; drawTeams(); } }); stOff = () => r.off('value', h);
  }
  function drawTeams() {
    const n = st.teams || 5; if (!(team >= 0 && team < n)) team = -1;
    $('#jtl').classList.remove('hide');
    $('#jteams').innerHTML = TEAMS.slice(0, n).map((T, i) => `<button data-t="${i}" class="${i === team ? 'on' : ''}" style="background:${T.c}"><b>${T.e}</b>${T.n}</button>`).join('');
    $('#jbtn').disabled = false;
  }
  jcode.oninput = checkCode;
  $('#jteams').onclick = e => { const b = e.target.closest('button'); if (!b) return; team = +b.dataset.t; drawTeams(); };
  $('#jbtn').onclick = async () => {
    const name = jname.value.trim();
    if (!name) { $('#jmsg').textContent = '이름을 써 주세요!'; jname.focus(); return; }
    if (team < 0) { $('#jmsg').textContent = '내 모둠을 골라 주세요!'; return; }
    localStorage.setItem('ttang_name', name); localStorage.setItem('ttang_team', team); localStorage.setItem('ttang_room', code);
    goFull(); keepAwake();
    await db.ref(R(code) + '/players/' + pid).set({ name, team, on: true, t: TS() });
    enter();
  };

  /* ----- 게임 화면 ----- */
  function enter() {
    if (stOff) { stOff(); stOff = null; }
    joined = true; ref = db.ref(R(code));
    $('#join').classList.add('hide'); $('#pad').classList.remove('hide');
    ref.child('in/' + pid).set('');
    if (!enter.hooked) enter.hooked = true, db.ref('.info/connected').on('value', s => {
      if (!s.val() || !joined) return;
      ref.child('players/' + pid).onDisconnect().update({ on: false }); ref.child('in/' + pid).onDisconnect().set('');
      ref.child('players/' + pid + '/name').once('value').then(n => { if (n.exists()) ref.child('players/' + pid).update({ on: true }); });
    });
    ref.child('players/' + pid).on('value', s => {
      const v = s.val(); if (!joined) return;
      if (!v || !v.name) { leave(); showJoin('선생님이 대기실에서 내보냈어요. 다시 들어와요!'); return; }
      team = v.team; localStorage.setItem('ttang_team', team);
      const T = TEAMS[team] || TEAMS[0];
      document.documentElement.style.setProperty('--tc', T.c);
      $('#pme').textContent = T.e; $('#pname b').textContent = v.name; $('#pname span').textContent = `${T.n}팀`; render();
    });
    ref.child('state').on('value', s => { const v = s.val(); if (!v) { leave(); showJoin('게임 방이 닫혔어요.'); return; } st = v; render(); });
    ref.child('cnt/' + pid).on('value', s => { myCells = s.val() || 0; render(); });
    ref.child('ev/' + pid).on('value', s => { const v = s.val(); if (!v || v.t <= lastEv) return; const fresh = lastEv > 0 || Date.now() - v.t < 5000; lastEv = v.t;
      if (fresh && ITEMS[v.k]) { toast(`${ITEMS[v.k].e} ${ITEMS[v.k].t}`); try { navigator.vibrate && navigator.vibrate([60, 40, 60]); } catch (e) {} } });
  }
  function leave() {
    joined = false; if (!ref) return;
    ['players/' + pid, 'state', 'cnt/' + pid, 'ev/' + pid].forEach(p => ref.child(p).off());
    ref.child('players/' + pid).onDisconnect().cancel(); ref.child('in/' + pid).onDisconnect().cancel();
  }
  function render() {
    const n = st.teams || 5, sc = st.scores || [], ph = st.phase;
    stackBar($('#pbar'), sc, n);
    $('#ptime').textContent = fmt(st.left ?? st.dur ?? 0);
    $('#prank').textContent = sc.length ? `우리 팀 ${rankOf(sc, n, team)}등 · ${(sc[team] || 0).toFixed(0)}%` : '';
    $('#pcells').textContent = `내가 칠한 칸 ${myCells}`;
    $('#bChange').classList.toggle('hide', ph !== 'lobby');
    const o = $('#pover'); let h = '';
    if (st.host === false) h = `<div class="em">📺</div>선생님 화면이 꺼졌어요<div class="sm">잠시 기다려요</div>`;
    else if (ph === 'lobby') h = `<div class="em">${(TEAMS[team] || TEAMS[0]).e}</div>준비 완료!<div class="sm">선생님이 시작하면 방향키로 움직여요<br>TV에서 내 이름을 찾아봐요</div>`;
    else if (ph === 'count') h = `<div class="n">${st.cd > 0 ? st.cd : 'GO!'}</div>`;
    else if (ph === 'pause') h = `<div class="em">⏸</div>잠깐 멈춤`;
    else if (ph === 'end') {
      const r = st.rank ? st.rank.indexOf(team) + 1 : rankOf(sc, n, team), m = (st.mvp || []).findIndex(x => x.id === pid);
      h = `<div class="em">${r === 1 ? '🏆' : ['', '🥇', '🥈', '🥉'][r] || '👏'}</div>우리 ${(TEAMS[team] || TEAMS[0]).n}팀 ${r}등!<div class="sm">내가 칠한 칸 ${myCells}칸${m >= 0 ? `<br>🏅 많이 칠한 사람 ${m + 1}위!` : ''}</div>`;
    }
    o.innerHTML = h; o.classList.toggle('hide', !h);
    o.style.background = ph === 'count' ? '#0005' : ''; o.style.pointerEvents = ph === 'count' ? 'none' : '';
  }

  /* ----- 방향키 ----- */
  const dp = $('#dpad'); let pidTouch = null;
  function setDir(d) {
    if (d === dir) return; dir = d;
    dp.querySelectorAll('.a').forEach(a => a.classList.toggle('on', a.classList.contains(d)));
    if (joined) ref.child('in/' + pid).set(d);
    if (d) try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
  }
  function fromPoint(e) {
    const r = dp.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) < r.width * .1) return '';
    return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u');
  }
  dp.addEventListener('pointerdown', e => { if (pidTouch !== null) return; pidTouch = e.pointerId; try { dp.setPointerCapture(e.pointerId); } catch (x) {} setDir(fromPoint(e)); e.preventDefault(); });
  dp.addEventListener('pointermove', e => { if (e.pointerId === pidTouch) setDir(fromPoint(e)); });
  const up = e => { if (e.pointerId === pidTouch) { pidTouch = null; setDir(''); } };
  dp.addEventListener('pointerup', up); dp.addEventListener('pointercancel', up); dp.addEventListener('lostpointercapture', up);
  const KEYS = { ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r', KeyW: 'u', KeyS: 'd', KeyA: 'l', KeyD: 'r' }, held = [];
  addEventListener('keydown', e => { const d = KEYS[e.code]; if (!d || !joined) return; e.preventDefault(); if (!held.includes(d)) held.push(d); setDir(held[held.length - 1]); });
  addEventListener('keyup', e => { const d = KEYS[e.code]; if (!d) return; const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); setDir(held[held.length - 1] || ''); });
  addEventListener('blur', () => { held.length = 0; setDir(''); });
  document.addEventListener('contextmenu', e => e.preventDefault());

  $('#bWhere').onclick = () => { if (!joined) return; ref.child('ping/' + pid).set(TS()); toast('📺 TV를 봐요! 노란 동그라미!'); };
  $('#bChange').onclick = () => { if (st.phase !== 'lobby') return; ref.child('players/' + pid).onDisconnect().cancel(); leave(); ref.child('players/' + pid).remove(); showJoin(); };

  /* ----- 시작 ----- */
  (async () => {
    if (code && jname.value) {   // 같은 방에 다시 들어온 경우 바로 이어서
      const v = (await db.ref(R(code) + '/players/' + pid).once('value')).val();
      if (v && v.name && (await db.ref(R(code) + '/state').once('value')).exists()) { enter(); return; }
    }
    showJoin();
  })();
}

if (MODE === 'host') Host(); else if (MODE === 'pad') Pad(); else $('#home').classList.remove('hide');
</script>
